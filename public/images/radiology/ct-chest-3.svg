<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <defs>
    <radialGradient id="ct3body" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="70%" stop-color="#383838"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <radialGradient id="ct3ll" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#060606"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <radialGradient id="ct3rl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#060606"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <radialGradient id="ct3med" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </radialGradient>
    <!-- Noise/texture filter -->
    <filter id="ct3noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background: scanner table dark -->
  <rect width="320" height="160" fill="#080808"/>

  <!-- CT gantry overlay (faint circle border of FOV) -->
  <circle cx="160" cy="80" r="76" fill="none" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Body cross-section (soft tissue window) -->
  <ellipse cx="160" cy="80" rx="74" ry="72" fill="url(#ct3body)" filter="url(#ct3noise)"/>

  <!-- Subcutaneous fat layer (slightly darker ring inside body) -->
  <ellipse cx="160" cy="80" rx="68" ry="66" fill="#303030" opacity="0.5"/>

  <!-- Left lung (air = very dark / black on CT) -->
  <ellipse cx="116" cy="78" rx="36" ry="44" fill="url(#ct3ll)"/>
  <!-- Left lung inner slightly lighter center (minor vessels) -->
  <ellipse cx="118" cy="76" rx="12" ry="14" fill="#0e0e0e" opacity="0.6"/>

  <!-- Right lung -->
  <ellipse cx="202" cy="78" rx="34" ry="44" fill="url(#ct3rl)"/>
  <ellipse cx="200" cy="76" rx="11" ry="14" fill="#0e0e0e" opacity="0.6"/>

  <!-- Mediastinum (heart + great vessels) — denser than soft tissue -->
  <ellipse cx="158" cy="84" rx="38" ry="36" fill="url(#ct3med)"/>

  <!-- Aorta (bright circular structure, left mediastinum) -->
  <circle cx="144" cy="72" r="8" fill="#606060"/>
  <circle cx="144" cy="72" r="5" fill="#383838"/>

  <!-- Pulmonary artery (slightly larger, anterior) -->
  <circle cx="158" cy="66" r="9" fill="#585858"/>
  <circle cx="158" cy="66" r="6" fill="#333333"/>

  <!-- Vertebral body (posterior, very bright — dense bone) -->
  <ellipse cx="160" cy="136" rx="12" ry="10" fill="#e8e8e8" opacity="0.85"/>
  <!-- Spinal canal -->
  <ellipse cx="160" cy="136" rx="5"  ry="4"  fill="#0a0a0a"/>
  <!-- Transverse processes -->
  <ellipse cx="140" cy="138" rx="7" ry="4" fill="#d0d0d0" opacity="0.7"/>
  <ellipse cx="180" cy="138" rx="7" ry="4" fill="#d0d0d0" opacity="0.7"/>

  <!-- Ribs (white dots/arcs around perimeter of chest) -->
  <ellipse cx="96"  cy="58"  rx="7" ry="5" fill="#c8c8c8" opacity="0.8"/>
  <ellipse cx="82"  cy="76"  rx="7" ry="5" fill="#c0c0c0" opacity="0.75"/>
  <ellipse cx="88"  cy="97"  rx="7" ry="5" fill="#c0c0c0" opacity="0.7"/>
  <ellipse cx="106" cy="116" rx="7" ry="5" fill="#b8b8b8" opacity="0.65"/>
  <ellipse cx="224" cy="58"  rx="7" ry="5" fill="#c8c8c8" opacity="0.8"/>
  <ellipse cx="238" cy="76"  rx="7" ry="5" fill="#c0c0c0" opacity="0.75"/>
  <ellipse cx="232" cy="97"  rx="7" ry="5" fill="#c0c0c0" opacity="0.7"/>
  <ellipse cx="214" cy="116" rx="7" ry="5" fill="#b8b8b8" opacity="0.65"/>
  <!-- Sternum (anterior, midline) -->
  <ellipse cx="160" cy="38"  rx="10" ry="6" fill="#c4c4c4" opacity="0.7"/>

  <!-- Measurement crosshairs (typical CT overlay) -->
  <line x1="160" y1="4"  x2="160" y2="156" stroke="#333333" stroke-width="0.5" opacity="0.5"/>
  <line x1="4"   y1="80" x2="316" y2="80"  stroke="#333333" stroke-width="0.5" opacity="0.5"/>

  <!-- Window/level label -->
  <text x="6"   y="14" font-family="monospace" font-size="6.5" fill="#555">W:400</text>
  <text x="6"   y="22" font-family="monospace" font-size="6.5" fill="#555">L:40</text>
  <text x="282" y="14" font-family="monospace" font-size="6.5" fill="#555" text-anchor="end">CHEST</text>
  <text x="282" y="22" font-family="monospace" font-size="6.5" fill="#555" text-anchor="end">AXIAL</text>
</svg>
