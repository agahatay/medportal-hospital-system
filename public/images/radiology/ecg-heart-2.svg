<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <!-- ECG strip background -->
  <rect width="320" height="160" fill="#0d1117"/>

  <!-- Fine grid — small squares every 8px -->
  <g stroke="#0f2a0f" stroke-width="0.4" opacity="0.9">
    <line x1="0" y1="8"   x2="320" y2="8"/>
    <line x1="0" y1="16"  x2="320" y2="16"/>
    <line x1="0" y1="24"  x2="320" y2="24"/>
    <line x1="0" y1="32"  x2="320" y2="32"/>
    <line x1="0" y1="48"  x2="320" y2="48"/>
    <line x1="0" y1="56"  x2="320" y2="56"/>
    <line x1="0" y1="64"  x2="320" y2="64"/>
    <line x1="0" y1="72"  x2="320" y2="72"/>
    <line x1="0" y1="88"  x2="320" y2="88"/>
    <line x1="0" y1="96"  x2="320" y2="96"/>
    <line x1="0" y1="104" x2="320" y2="104"/>
    <line x1="0" y1="112" x2="320" y2="112"/>
    <line x1="0" y1="128" x2="320" y2="128"/>
    <line x1="0" y1="136" x2="320" y2="136"/>
    <line x1="0" y1="144" x2="320" y2="144"/>
    <line x1="0" y1="152" x2="320" y2="152"/>
    <line x1="8"   y1="0" x2="8"   y2="160"/>
    <line x1="16"  y1="0" x2="16"  y2="160"/>
    <line x1="24"  y1="0" x2="24"  y2="160"/>
    <line x1="32"  y1="0" x2="32"  y2="160"/>
    <line x1="48"  y1="0" x2="48"  y2="160"/>
    <line x1="56"  y1="0" x2="56"  y2="160"/>
    <line x1="64"  y1="0" x2="64"  y2="160"/>
    <line x1="72"  y1="0" x2="72"  y2="160"/>
    <line x1="88"  y1="0" x2="88"  y2="160"/>
    <line x1="96"  y1="0" x2="96"  y2="160"/>
    <line x1="104" y1="0" x2="104" y2="160"/>
    <line x1="112" y1="0" x2="112" y2="160"/>
    <line x1="128" y1="0" x2="128" y2="160"/>
    <line x1="136" y1="0" x2="136" y2="160"/>
    <line x1="144" y1="0" x2="144" y2="160"/>
    <line x1="152" y1="0" x2="152" y2="160"/>
    <line x1="168" y1="0" x2="168" y2="160"/>
    <line x1="176" y1="0" x2="176" y2="160"/>
    <line x1="184" y1="0" x2="184" y2="160"/>
    <line x1="192" y1="0" x2="192" y2="160"/>
    <line x1="208" y1="0" x2="208" y2="160"/>
    <line x1="216" y1="0" x2="216" y2="160"/>
    <line x1="224" y1="0" x2="224" y2="160"/>
    <line x1="232" y1="0" x2="232" y2="160"/>
    <line x1="248" y1="0" x2="248" y2="160"/>
    <line x1="256" y1="0" x2="256" y2="160"/>
    <line x1="264" y1="0" x2="264" y2="160"/>
    <line x1="272" y1="0" x2="272" y2="160"/>
    <line x1="288" y1="0" x2="288" y2="160"/>
    <line x1="296" y1="0" x2="296" y2="160"/>
    <line x1="304" y1="0" x2="304" y2="160"/>
    <line x1="312" y1="0" x2="312" y2="160"/>
  </g>

  <!-- Large grid — every 40px (5 small squares) -->
  <g stroke="#1a4a1a" stroke-width="0.8" opacity="0.8">
    <line x1="0"   y1="40"  x2="320" y2="40"/>
    <line x1="0"   y1="80"  x2="320" y2="80"/>
    <line x1="0"   y1="120" x2="320" y2="120"/>
    <line x1="40"  y1="0"   x2="40"  y2="160"/>
    <line x1="80"  y1="0"   x2="80"  y2="160"/>
    <line x1="120" y1="0"   x2="120" y2="160"/>
    <line x1="160" y1="0"   x2="160" y2="160"/>
    <line x1="200" y1="0"   x2="200" y2="160"/>
    <line x1="240" y1="0"   x2="240" y2="160"/>
    <line x1="280" y1="0"   x2="280" y2="160"/>
  </g>

  <!-- Channel separator line -->
  <line x1="0" y1="82" x2="320" y2="82" stroke="#1f3f1f" stroke-width="1" opacity="0.5"/>

  <!-- =====  LEAD I  (baseline y=42) ===== -->
  <!-- Beat 1: normal sinus -->
  <polyline
    points="0,42 6,42 10,35 14,35 18,42 22,45 24,10 26,48 30,42 36,32 42,32 48,42 60,42"
    stroke="#00e676" stroke-width="1.5" fill="none"/>
  <!-- Beat 2: PVC — wide bizarre QRS, no P wave, inverted T, compensatory pause -->
  <polyline
    points="60,42 64,50 68,6 76,60 82,42 86,52 92,42 118,42"
    stroke="#00e676" stroke-width="1.5" fill="none"/>
  <!-- Beat 3: normal -->
  <polyline
    points="118,42 122,42 126,35 130,35 134,42 138,45 140,10 142,48 146,42 152,32 158,32 164,42 178,42"
    stroke="#00e676" stroke-width="1.5" fill="none"/>
  <!-- Beat 4: normal -->
  <polyline
    points="178,42 182,42 186,35 190,35 194,42 198,45 200,10 202,48 206,42 212,32 218,32 224,42 238,42"
    stroke="#00e676" stroke-width="1.5" fill="none"/>
  <!-- Beat 5: normal -->
  <polyline
    points="238,42 242,42 246,35 250,35 254,42 258,45 260,10 262,48 266,42 272,32 278,32 284,42 320,42"
    stroke="#00e676" stroke-width="1.5" fill="none"/>

  <!-- =====  LEAD II  (baseline y=122) ===== -->
  <!-- Beat 1 -->
  <polyline
    points="0,122 6,122 10,114 14,114 18,122 22,126 24,88 26,130 30,122 36,110 42,110 48,122 60,122"
    stroke="#00c853" stroke-width="1.5" fill="none"/>
  <!-- PVC -->
  <polyline
    points="60,122 64,132 68,82 76,144 82,122 86,133 92,122 118,122"
    stroke="#00c853" stroke-width="1.5" fill="none"/>
  <!-- Beat 3 -->
  <polyline
    points="118,122 122,122 126,114 130,114 134,122 138,126 140,88 142,130 146,122 152,110 158,110 164,122 178,122"
    stroke="#00c853" stroke-width="1.5" fill="none"/>
  <!-- Beat 4 -->
  <polyline
    points="178,122 182,122 186,114 190,114 194,122 198,126 200,88 202,130 206,122 212,110 218,110 224,122 238,122"
    stroke="#00c853" stroke-width="1.5" fill="none"/>
  <!-- Beat 5 -->
  <polyline
    points="238,122 242,122 246,114 250,114 254,122 258,126 260,88 262,130 266,122 272,110 278,110 284,122 320,122"
    stroke="#00c853" stroke-width="1.5" fill="none"/>

  <!-- Lead labels -->
  <text x="4" y="15"  font-family="monospace" font-size="8" fill="#009624">I</text>
  <text x="4" y="95"  font-family="monospace" font-size="8" fill="#009624">II</text>

  <!-- PVC annotation -->
  <text x="66" y="8" font-family="monospace" font-size="6.5" fill="#ff6d00">PVC</text>
  <line x1="70" y1="10" x2="68" y2="18" stroke="#ff6d00" stroke-width="0.8"/>

  <!-- Paper speed label -->
  <text x="296" y="158" font-family="monospace" font-size="6" fill="#1a4a1a" text-anchor="end">25mm/s</text>
</svg>
